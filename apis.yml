name: Pretzel Therapeutics
description: 'Pretzel Therapeutics is a biopharmaceutical company developing first-in-class
  medicines that target mitochondrial biology and cellular energy regulation. Its pipeline
  spans neurological, muscular atrophy, metabolic, and rare disease indications, applying
  novel mitochondrial modulation approaches to conditions driven by dysfunctional cellular
  energy production. Backed by GV, the company operates as a therapeutics developer and
  publishes no public API or developer platform; this profile is maintained in the API
  Evangelist network as a portfolio company record and life-sciences lead.'
